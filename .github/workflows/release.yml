name: Release

# Push a tag such as v1.0.0 (or v1.1.0-preview.1) to publish every package in the solution to NuGet.
# PdfNetStack.Ocr.Models keeps its own version (set in its project) and changes only with the model
# files; a release whose models version is already on NuGet skips it.
#
# Authentication, in order of preference:
# - Trusted publishing: a policy on nuget.org for this repository, this workflow file and the
#   production environment, and the NUGET_USER secret holding the nuget.org user name (the
#   profile name, not the email). No stored API key.
# - Otherwise the NUGET_API_KEY repository secret.
#
# Every package and command line binary gets a build provenance attestation (verify one with
# `gh attestation verify <file> --repo JADEV-CORP/pdf.netstack`), and every package a CycloneDX
# SBOM attached to the GitHub release.
on:
  push:
    tags: ['v*.*.*']

# Each job asks for what it needs.
permissions: {}

jobs:
  cli:
    # The command line tool compiled ahead of time for each platform: one self-contained
    # executable, no .NET install needed. The publish job attaches them to the GitHub release,
    # so they ship only when everything else does.
    strategy:
      matrix:
        include:
          - { rid: linux-x64, os: ubuntu-latest }
          - { rid: linux-arm64, os: ubuntu-24.04-arm }
          - { rid: win-x64, os: windows-latest }
          - { rid: osx-x64, os: macos-latest }
          - { rid: osx-arm64, os: macos-latest }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Native toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Native AOT publish (no trim or AOT warnings allowed)
        run: dotnet publish src/PdfNetStack.Cli -c Release -f net10.0 -r ${{ matrix.rid }} -p:NativeAot=true -p:Version=${VERSION} -o publish

      - name: Name the binary
        run: |
          ext=""
          [[ "${{ matrix.rid }}" == win-* ]] && ext=".exe"
          mkdir dist
          cp "publish/PdfNetStack.Tool${ext}" "dist/pdfnetstack-${VERSION}-${{ matrix.rid }}${ext}"
          echo "BINARY=dist/pdfnetstack-${VERSION}-${{ matrix.rid }}${ext}" >> "$GITHUB_ENV"

      - name: Smoke test
        # osx-x64 is cross compiled on an arm64 runner and cannot run there.
        if: matrix.rid != 'osx-x64'
        run: |
          "./${BINARY}" --help
          "./${BINARY}" inspect tests/PdfNetStack.Tests/Fixtures/Forms/form.pdf

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: cli
    runs-on: ubuntu-latest
    # Must match the environment in the nuget.org trusted publishing policy.
    environment: production
    permissions:
      contents: write # the GitHub release
      id-token: write # NuGet trusted publishing and the attestations
      attestations: write
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      CYCLONEDX_VERSION: 6.3.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Changelog entry
        run: |
          # The section for this version, without its heading. Fails the release if it is missing.
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if (index($0, "## " v) == 1) { found = 1; next } }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md
          cat release-notes.md

      - name: Build
        run: dotnet build PdfNetStack.sln -c Release -p:Version=${VERSION}

      - name: Test
        run: dotnet test PdfNetStack.sln -c Release --no-build

      - name: License check
        shell: pwsh
        run: ./eng/check-licenses.ps1

      # The models package packs the OCR model files, never committed: fetched here and checked
      # against their pinned SHA-256 again when packed.
      - name: Fetch the OCR models
        run: python3 tools/fetch_ocr_models.py src/PdfNetStack.Ocr.Models/models

      - name: Pack
        run: dotnet pack PdfNetStack.sln -c Release --no-build -o artifacts -p:Version=${VERSION}

      # One CycloneDX SBOM per package: its NuGet dependencies, per target framework, and the
      # projects it is built from, from the restore this job just did. The trimming tasks run at
      # build time only and ship in no package.
      - name: SBOM
        run: |
          dotnet tool install CycloneDX --version "$CYCLONEDX_VERSION" --tool-path .tools
          mkdir sbom
          for project in src/*/*.csproj; do
            properties=$(dotnet msbuild "$project" -getProperty:PackageId -getProperty:PackageVersion -p:Version="$VERSION")
            id=$(jq -r .Properties.PackageId <<< "$properties")
            version=$(jq -r .Properties.PackageVersion <<< "$properties")
            type=Library
            [[ "$id" == *.Tool ]] && type=Application
            .tools/dotnet-CycloneDX "$project" --output sbom --filename "$id.$version.cdx.json" --output-format Json \
              --set-name "$id" --set-version "$version" --set-type "$type" --include-project-references --set-nuget-purl \
              --disable-package-restore --exclude-filter Microsoft.NET.ILLink.Tasks
          done
          ls -l sbom

      - name: Command line binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          path: cli
          merge-multiple: true

      - name: Checksums
        working-directory: cli
        run: |
          sha256sum pdfnetstack-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Signed statements, in GitHub's attestation store, that this workflow built these files
      # from this commit. Made before anything is published, so a release never ships without them.
      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
            cli/pdfnetstack-*

      - name: NuGet login (trusted publishing)
        if: env.NUGET_API_KEY == ''
        id: login
        # Pinned to a commit: this job can publish packages. Dependabot keeps the pin current.
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        env:
          KEY: ${{ steps.login.outputs.NUGET_API_KEY || env.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          [[ "$VERSION" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" artifacts/* cli/* sbom/* --title "PdfNetStack $VERSION" --notes-file release-notes.md "${flags[@]}"
