name: Corpus benchmark

# Downloads the public benchmark corpus (eng/corpus/manifest.json: public domain and openly
# licensed documents, never committed), runs tools/corpus_bench.py over it and uploads the
# Markdown and JSON report. Runs weekly, on demand, and for every version tag: then the report is
# attached to the GitHub release with a comparison against the previous release's report
# (tools/corpus_compare.py), so a regression in size, time or memory shows next to the release.
# There is no pull_request trigger, so pull requests, from forks or not, never run it; the
# repository check keeps forks' schedules off.
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
  push:
    tags: ['v*.*.*']

# Each job asks for what it needs.
permissions: {}

concurrency:
  group: corpus
  cancel-in-progress: false

jobs:
  benchmark:
    if: github.repository == 'JADEV-CORP/pdf.netstack'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 180
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      CORPUS_CACHE: ${{ github.workspace }}/artifacts/corpus/files
      CORPUS_REPORT: ${{ github.workspace }}/artifacts/corpus/report
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install the render check
        run: python -m pip install pypdfium2==5.13.0 numpy==2.2.2

      # The cache is keyed on the manifest, so a changed entry downloads again. Restore and save
      # are separate steps so a run that reports failures still keeps its downloads.
      - name: Restore the corpus
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CORPUS_CACHE }}
          key: corpus-${{ hashFiles('eng/corpus/manifest.json') }}
          restore-keys: corpus-

      - name: Fetch the corpus
        id: fetch
        continue-on-error: true
        run: python tools/fetch_corpus.py --cache "$CORPUS_CACHE"

      - name: Save the corpus
        if: steps.restore.outputs.cache-hit != 'true' && steps.fetch.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CORPUS_CACHE }}
          key: corpus-${{ hashFiles('eng/corpus/manifest.json') }}

      - name: Build the runner
        run: dotnet build tools/PdfNetStack.CorpusRunner -c Release

      - name: Run the benchmark
        run: python tools/corpus_bench.py --cache "$CORPUS_CACHE" --out "$CORPUS_REPORT" --jobs 4

      - name: Job summary
        if: always()
        run: |
          if [ -f "$CORPUS_REPORT/report.md" ]; then cat "$CORPUS_REPORT/report.md" >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: corpus-report
          path: |
            artifacts/corpus/report/report.md
            artifacts/corpus/report/report.json
          retention-days: 90
          if-no-files-found: warn

      - name: Fail when a download failed
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::Some corpus files could not be fetched or changed upstream; see the Fetch the corpus step."
          exit 1

  compare:
    # Runs the same corpus through qpdf, MuPDF and Ghostscript next to PdfNetStack
    # (tools/compare_optimizers.py) and scores each output on size, rendering and what it kept,
    # PDF/A conformance (veraPDF) and usage rights included. PdfNetStack runs with the library
    # defaults as the Native AOT command line tool on one thread, so start up does not count.
    if: github.repository == 'JADEV-CORP/pdf.netstack'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 180
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      CORPUS_CACHE: ${{ github.workspace }}/artifacts/corpus/files
      COMPARE_REPORT: ${{ github.workspace }}/artifacts/compare
      # Ubuntu 24.04 ships qpdf 11.9; the comparison uses qpdf's current release, checked against
      # the SHA-256 qpdf publishes for it.
      QPDF_VERSION: 12.4.2
      QPDF_SHA256: db367d897829f22c4198ce1094143c9d467bd6ee7dfabc44ba6f02056b24f8b1
      VERAPDF_VERSION: 1.28.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Install the render check and the other optimizers
        run: |
          python -m pip install pypdfium2==5.13.0 numpy==2.2.2
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mupdf-tools ghostscript clang zlib1g-dev
          curl -fsSL -o "$RUNNER_TEMP/qpdf.zip" "https://github.com/qpdf/qpdf/releases/download/v${QPDF_VERSION}/qpdf-${QPDF_VERSION}-bin-linux-x86_64.zip"
          echo "$QPDF_SHA256  $RUNNER_TEMP/qpdf.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/qpdf.zip" -d "$RUNNER_TEMP/qpdf"
          echo "$RUNNER_TEMP/qpdf/bin" >> "$GITHUB_PATH"

      # As in the PDF/A workflow: the release installer, with an automated installation file.
      - name: Cache veraPDF
        id: verapdf
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/verapdf
          key: verapdf-greenfield-${{ env.VERAPDF_VERSION }}-${{ runner.os }}

      - name: Install veraPDF
        if: steps.verapdf.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          minor="${VERAPDF_VERSION%.*}"
          work="$RUNNER_TEMP/verapdf-installer"
          mkdir -p "$work"
          curl -fsSL -o "$work/installer.zip" "https://software.verapdf.org/rel/${minor}/verapdf-greenfield-${VERAPDF_VERSION}-installer.zip"
          unzip -q "$work/installer.zip" -d "$work"
          jar="$(find "$work" -name 'verapdf-izpack-installer-*.jar' | head -n 1)"
          cat > "$work/auto-install.xml" <<EOF
          <?xml version="1.0" encoding="UTF-8" standalone="no"?>
          <AutomatedInstallation langpack="eng">
            <com.izforge.izpack.panels.htmlhello.HTMLHelloPanel id="welcome"/>
            <com.izforge.izpack.panels.target.TargetPanel id="install_dir">
              <installpath>$HOME/verapdf</installpath>
            </com.izforge.izpack.panels.target.TargetPanel>
            <com.izforge.izpack.panels.packs.PacksPanel id="sdk_pack_select">
              <pack index="0" name="veraPDF GUI" selected="true"/>
              <pack index="1" name="veraPDF Mac and *nix Scripts" selected="true"/>
              <pack index="2" name="veraPDF Validation model" selected="false"/>
              <pack index="3" name="veraPDF Documentation" selected="false"/>
              <pack index="4" name="veraPDF Sample Plugins" selected="false"/>
            </com.izforge.izpack.panels.packs.PacksPanel>
            <com.izforge.izpack.panels.install.InstallPanel id="install"/>
            <com.izforge.izpack.panels.finish.FinishPanel id="finish"/>
          </AutomatedInstallation>
          EOF
          java -jar "$jar" "$work/auto-install.xml"
          test -x "$HOME/verapdf/verapdf"

      - name: Tool versions
        run: |
          qpdf --version | head -n 1
          "$HOME/verapdf/verapdf" --version

      - name: Restore the corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CORPUS_CACHE }}
          key: corpus-${{ hashFiles('eng/corpus/manifest.json') }}
          restore-keys: corpus-

      - name: Fetch the corpus
        run: python tools/fetch_corpus.py --cache "$CORPUS_CACHE"

      - name: Native AOT command line tool
        run: dotnet publish src/PdfNetStack.Cli -c Release -f net10.0 -r linux-x64 -p:NativeAot=true -o artifacts/aot

      - name: Compare
        run: |
          python tools/compare_optimizers.py --cache "$CORPUS_CACHE" --out "$COMPARE_REPORT" --jobs 4 \
            --tool artifacts/aot/PdfNetStack.Tool --verapdf "$HOME/verapdf/verapdf"

      - name: Job summary
        if: always()
        run: |
          if [ -f "$COMPARE_REPORT/compare.md" ]; then cat "$COMPARE_REPORT/compare.md" >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: compare-report
          path: |
            artifacts/compare/compare.md
            artifacts/compare/compare.json
          retention-days: 90
          if-no-files-found: warn

  release:
    # Attaches the report of a version tag to its release, with the comparison. The release itself
    # is created by the Release workflow; this job waits for it.
    needs: benchmark
    if: always() && startsWith(github.ref, 'refs/tags/v') && github.repository == 'JADEV-CORP/pdf.netstack'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: corpus-report
          path: report

      - name: Compare with the previous release
        run: |
          previous=$(git tag --list 'v*.*.*' --sort=-v:refname | grep -v -x "$TAG" | grep -v -- '-' | head -n 1 || true)
          mkdir -p previous
          if [ -n "$previous" ] && gh release download "$previous" --pattern corpus-report.json --dir previous 2>/dev/null; then
            python3 tools/corpus_compare.py previous/corpus-report.json report/report.json \
              --previous-label "$previous" --current-label "$TAG" --out report/comparison.md
          else
            printf '# Corpus benchmark: %s\n\nNo report is attached to a previous release, so there is nothing to compare with.\n' "$TAG" > report/comparison.md
          fi
          cat report/comparison.md >> "$GITHUB_STEP_SUMMARY"

      - name: Attach to the release
        run: |
          for i in $(seq 1 60); do
            gh release view "$TAG" > /dev/null 2>&1 && break
            sleep 60
          done
          cp report/report.md corpus-report.md
          cp report/report.json corpus-report.json
          cp report/comparison.md corpus-comparison.md
          gh release upload "$TAG" corpus-report.md corpus-report.json corpus-comparison.md --clobber
